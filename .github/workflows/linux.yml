# The Linux drift gates. LINUX.md says to run these after every rebase onto a new upstream
# tag; this is what makes that true rather than aspirational.
#
# `tools/gen_win32con.py --check` is deliberately NOT here: it downloads the pywin32
# win_amd64 wheel from PyPI on every invocation, so it fails on an offline or rate-limited
# runner for reasons that have nothing to do with the tree. It runs in a separate
# non-blocking job below, and LINUX.md flags it as network-dependent.

name: Linux port gates

on:
  push:
    branches: [ linux-port ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Import gates and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with every extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[web,default,qt,adb,ocr,dev]' pytest-qt

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      # Order matters: the scanner says whether the *shape* of the Win32 import surface
      # moved, before the others report that something broke.
      - name: Module-level Win32 scan
        run: python tools/scan_module_level_win32.py --check

      - name: Lazy-import sweep
        run: python tools/check_linux_imports.py

      # The six deselected tests are Windows-only by construction, not port regressions:
      # MuMu emulator path parsing and os.startfile (backslashes are not separators on
      # POSIX), one exact Qt pixel height (font metrics differ per platform), and two
      # pywebview WinForms window-shaping tests. They are enumerated in LINUX.md; keep the
      # two lists in step. Anything failing outside this list is a regression.
      - name: Test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests \
            --deselect 'tests/test_device_manager.py::TestEmulatorWindowExe::test_resolves_mumu_12_instance_window' \
            --deselect 'tests/test_device_manager.py::TestEmulatorWindowExe::test_resolves_mumu_15_instance_window' \
            --deselect 'tests/test_process.py::TestProcessExecute::test_execute_can_use_os_startfile_when_configured' \
            --deselect 'tests/test_task_ui.py::TestTaskUi::test_task_card_uses_single_line_compact_header' \
            --deselect 'tests/test_web_server.py::test_native_resize_handle_is_invisible_but_not_click_through' \
            --deselect 'tests/test_web_server.py::test_rounded_window_region_tracks_native_window_size'

  win32con-drift:
    name: win32con constants (needs PyPI)
    runs-on: ubuntu-latest
    continue-on-error: true      # network-dependent; must not gate a merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen_win32con.py --check
